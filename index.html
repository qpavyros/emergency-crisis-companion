<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="EmergencyKit PWA - أداة الطوارئ والفرز الطبي وحسابات البقاء الميدانية بدون إنترنت 100%">
    <title>EmergencyKit - رفيق الطوارئ والفرز الطبي الميداني</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-slate: #475569;
        }

        body.hud-mode {
            --bg-primary: #000000 !important;
            --bg-card: #050505 !important;
            --bg-inner: #000000 !important;
            --text-main: #ffff00 !important;
            --text-sub: #ffffaa !important;
            --border-color: #ffff00 !important;
            --accent-red: #ff3333 !important;
            --accent-yellow: #ffff00 !important;
            --accent-green: #00ff00 !important;
            --accent-blue: #00ffff !important;
            --accent-slate: #222200 !important;
        }

        body.hud-mode .btn {
            font-size: 1.1rem !important;
            padding: 1.1rem !important;
            border: 2px solid #ffff00 !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); line-height: 1.5; padding-bottom: 75px; transition: background 0.2s, color 0.2s; contain: content; }
        
        header { background: #b91c1c; padding: 0.75rem 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; }
        body.hud-mode header { background: #000000 !important; border-bottom: 3px solid #ffff00; }
        header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }

        nav { display: flex; background: #020617; position: fixed; bottom: 0; width: 100%; z-index: 100; border-top: 1px solid var(--border-color); overflow-x: auto; }
        body.hud-mode nav { background: #000000 !important; border-top: 3px solid #ffff00; }
        nav button { flex: 1; min-width: 40px; padding: 0.6rem 0.1rem; background: none; border: none; color: var(--text-sub); font-size: 0.58rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; white-space: nowrap; }
        nav button.active { color: var(--text-main); font-weight: bold; background: var(--bg-card); border-top: 2px solid var(--accent-red); }

        .tab-content { display: none; padding: 1rem; max-width: 850px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent-red); display: flex; align-items: center; gap: 0.5rem; }

        .btn { padding: 0.7rem 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; margin-top: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-yellow { background: var(--accent-yellow); color: black; }
        .btn-blue { background: var(--accent-blue); color: black; }
        .btn-slate { background: var(--accent-slate); color: white; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 EmergencyKit PWA</h1>
        <button onclick="toggleTacticalHUD()" class="btn btn-yellow" style="width:auto; padding:0.3rem 0.6rem; font-size:0.8rem; margin:0;" title="نمط الرؤية التكتيكي HUD">🖥️ HUD</button>
    </header>

    <!-- Tab 0: High-Contrast Emergency HUD Mode (Task 26) -->
    <section id="hud-tab" class="tab-content active">
        <div class="card" style="text-align:center;">
            <h2>🖥️ نمط الرؤية التكتيكي عالي التباين (High-Contrast Tactical HUD)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:1rem;">واجهة صفراء وسوداء ذات تباين فائق وأزرار ضخمة للعمل أثناء ارتداء القفازات الثقيلة أو تحت أشعة الشمس المباشرة.</p>

            <button class="btn btn-yellow" style="font-size:1.1rem; padding:1.2rem;" onclick="toggleTacticalHUD()">
                🖥️ تفعيل / إيقاف نمط HUD عالي التباين
            </button>

            <div id="hud-state-box" style="margin-top:1rem; padding:1rem; background:var(--bg-inner); border-radius:8px;">
                <div style="color:var(--accent-yellow);">حالة النمط: <strong id="hud-mode-state">معطل</strong></div>
            </div>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="switchTab('hud-tab', this)">
            <span>🖥️</span>
            <span>HUD</span>
        </button>
    </nav>

    <script defer>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
            });
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Task 26: High-Contrast Tactical HUD Logic
        function toggleTacticalHUD() {
            document.body.classList.toggle('hud-mode');
            const isHUD = document.body.classList.contains('hud-mode');
            document.getElementById('hud-mode-state').textContent = isHUD ? 'مفعل (أصفر/أسود تباين عالي للأشعة والقفازات)' : 'معطل';
            localStorage.setItem('hud_mode', isHUD ? 'true' : 'false');
        }

        if (localStorage.getItem('hud_mode') === 'true') {
            document.body.classList.add('hud-mode');
        }
    </script>
</body>
</html>
