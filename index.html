<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="EmergencyKit PWA - أداة الطوارئ والفرز الطبي وحسابات البقاء الميدانية بدون إنترنت 100%">
    <title>EmergencyKit - رفيق الطوارئ والفرز الطبي الميداني</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-slate: #475569;
        }

        body.night-mode {
            --bg-primary: #050000;
            --bg-card: #180303;
            --bg-inner: #0a0101;
            --text-main: #ff4d4d;
            --text-sub: #991b1b;
            --border-color: #7f1d1d;
            --accent-red: #ff0000;
            --accent-yellow: #b91c1c;
            --accent-green: #991b1b;
            --accent-blue: #ef4444;
            --accent-slate: #450a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); line-height: 1.5; padding-bottom: 75px; transition: background 0.3s, color 0.3s; }
        
        header { background: #b91c1c; padding: 0.75rem 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; }
        body.night-mode header { background: #450a0a; }
        header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }

        nav { display: flex; background: #020617; position: fixed; bottom: 0; width: 100%; z-index: 100; border-top: 1px solid var(--border-color); overflow-x: auto; }
        body.night-mode nav { background: #0a0101; }
        nav button { flex: 1; min-width: 40px; padding: 0.6rem 0.1rem; background: none; border: none; color: var(--text-sub); font-size: 0.58rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; white-space: nowrap; }
        nav button.active { color: var(--text-main); font-weight: bold; background: var(--bg-card); border-top: 2px solid var(--accent-red); }

        .tab-content { display: none; padding: 1rem; max-width: 850px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent-red); display: flex; align-items: center; gap: 0.5rem; }

        .btn { padding: 0.7rem 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; margin-top: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-yellow { background: var(--accent-yellow); color: black; }
        .btn-blue { background: var(--accent-blue); color: black; }
        .btn-slate { background: var(--accent-slate); color: white; }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-sub); }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border-color); font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 EmergencyKit PWA</h1>
        <div style="display:flex; gap:0.4rem; align-items:center;">
            <select id="i18n-lang-select" onchange="changeAppLanguage(this.value)" style="background:#0f172a; color:white; border:1px solid #334155; border-radius:6px; padding:0.25rem 0.4rem; font-size:0.8rem;">
                <option value="ar">العربية (AR)</option>
                <option value="en">English (EN)</option>
                <option value="fr">Français (FR)</option>
            </select>
            <button onclick="toggleNightMode()" class="btn btn-slate" style="width:auto; padding:0.3rem 0.6rem; font-size:0.8rem; margin:0;">🌙</button>
        </div>
    </header>

    <!-- Tab 0: Multi-lingual i18n Interface (Task 20) -->
    <section id="i18n-tab" class="tab-content active">
        <div class="card">
            <h2 id="i18n-title">🌐 الدعم متعدد اللغات (Multi-Lingual i18n)</h2>
            <p id="i18n-desc" style="color:var(--text-sub); font-size:0.85rem; margin-bottom:1rem;">تبديل لغة واجهة التطبيق بالكامل فورياً بدون الحاجة إلى اتصال بالإنترنت.</p>

            <div style="background:var(--bg-inner); padding:1rem; border-radius:8px; text-align:center;">
                <h3 id="i18n-status-title" style="color:var(--accent-blue);">اللغة الحالية: العربية</h3>
                <p id="i18n-status-msg" style="font-size:0.9rem; color:var(--text-sub); margin-top:0.4rem;">التطبيق يعمل 100% بدون إنترنت بجميع اللغات.</p>
            </div>
        </div>
    </section>

    <!-- Tab 1: Audio Notes -->
    <section id="audio-tab" class="tab-content">
        <div class="card">
            <h2>🎙️ مسجل الملاحظات الصوتية (Audio Notes Vault)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem;">تسجيل ملاحظات صوتية لحالة المصابين.</p>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="switchTab('i18n-tab', this)">
            <span>🌐</span>
            <span id="nav-lang">اللغة</span>
        </button>
        <button onclick="switchTab('audio-tab', this)">
            <span>🎙️</span>
            <span id="nav-audio">صوتيات</span>
        </button>
    </nav>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        }

        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
            localStorage.setItem('night_mode', document.body.classList.contains('night-mode') ? 'true' : 'false');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Task 20: Full Multi-Lingual i18n Translations Dictionary
        const i18nDict = {
            ar: {
                dir: 'rtl',
                title: '🌐 الدعم متعدد اللغات (Multi-Lingual i18n)',
                desc: 'تبديل لغة واجهة التطبيق بالكامل فورياً بدون الحاجة إلى اتصال بالإنترنت.',
                statusTitle: 'اللغة الحالية: العربية',
                statusMsg: 'التطبيق يعمل 100% بدون إنترنت بجميع اللغات.',
                navLang: 'اللغة', navAudio: 'صوتيات'
            },
            en: {
                dir: 'ltr',
                title: '🌐 Multi-Lingual Support (i18n)',
                desc: 'Instantly switch the application language completely offline.',
                statusTitle: 'Current Language: English',
                statusMsg: 'The app works 100% offline in all supported languages.',
                navLang: 'Language', navAudio: 'Audio'
            },
            fr: {
                dir: 'ltr',
                title: '🌐 Support Multilingue (i18n)',
                desc: 'Changez la langue de l\'application instantanément hors ligne.',
                statusTitle: 'Langue Actuelle: Français',
                statusMsg: 'L\'application fonctionne à 100% hors ligne dans toutes les langues.',
                navLang: 'Langue', navAudio: 'Audio'
            }
        };

        function changeAppLanguage(lang) {
            const t = i18nDict[lang] || i18nDict.ar;
            const root = document.getElementById('html-root');
            root.setAttribute('lang', lang);
            root.setAttribute('dir', t.dir);

            document.getElementById('i18n-title').textContent = t.title;
            document.getElementById('i18n-desc').textContent = t.desc;
            document.getElementById('i18n-status-title').textContent = t.statusTitle;
            document.getElementById('i18n-status-msg').textContent = t.statusMsg;
            document.getElementById('nav-lang').textContent = t.navLang;
            document.getElementById('nav-audio').textContent = t.navAudio;

            localStorage.setItem('app_lang', lang);
        }

        const savedLang = localStorage.getItem('app_lang');
        if (savedLang) {
            document.getElementById('i18n-lang-select').value = savedLang;
            changeAppLanguage(savedLang);
        }
    </script>
</body>
</html>
