<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="EmergencyKit PWA - أداة الطوارئ والفرز الطبي وحسابات البقاء الميدانية بدون إنترنت 100%">
    <title>EmergencyKit - رفيق الطوارئ والفرز الطبي الميداني</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-slate: #475569;
        }

        body.night-mode {
            --bg-primary: #050000;
            --bg-card: #180303;
            --bg-inner: #0a0101;
            --text-main: #ff4d4d;
            --text-sub: #991b1b;
            --border-color: #7f1d1d;
            --accent-red: #ff0000;
            --accent-yellow: #b91c1c;
            --accent-green: #991b1b;
            --accent-blue: #ef4444;
            --accent-slate: #450a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); line-height: 1.5; padding-bottom: 75px; transition: background 0.3s, color 0.3s; }
        
        header { background: #b91c1c; padding: 0.75rem 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; }
        body.night-mode header { background: #450a0a; }
        header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }

        nav { display: flex; background: #020617; position: fixed; bottom: 0; width: 100%; z-index: 100; border-top: 1px solid var(--border-color); overflow-x: auto; }
        body.night-mode nav { background: #0a0101; }
        nav button { flex: 1; min-width: 40px; padding: 0.6rem 0.1rem; background: none; border: none; color: var(--text-sub); font-size: 0.58rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; white-space: nowrap; }
        nav button.active { color: var(--text-main); font-weight: bold; background: var(--bg-card); border-top: 2px solid var(--accent-red); }

        .tab-content { display: none; padding: 1rem; max-width: 850px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent-red); display: flex; align-items: center; gap: 0.5rem; }

        .btn { padding: 0.7rem 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; margin-top: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-yellow { background: var(--accent-yellow); color: black; }
        .btn-blue { background: var(--accent-blue); color: black; }
        .btn-slate { background: var(--accent-slate); color: white; }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-sub); }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border-color); font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 EmergencyKit PWA</h1>
        <div style="display:flex; gap:0.4rem; align-items:center;">
            <select id="i18n-lang-select" onchange="changeAppLanguage(this.value)" style="background:#0f172a; color:white; border:1px solid #334155; border-radius:6px; padding:0.25rem 0.4rem; font-size:0.8rem;">
                <option value="ar">العربية (AR)</option>
                <option value="en">English (EN)</option>
                <option value="fr">Français (FR)</option>
            </select>
            <button onclick="toggleNightMode()" class="btn btn-slate" style="width:auto; padding:0.3rem 0.6rem; font-size:0.8rem; margin:0;">🌙</button>
        </div>
    </header>

    <!-- Tab 0: Local Web Crypto AES-GCM Encryption (Task 21) -->
    <section id="crypto-tab" class="tab-content active">
        <div class="card">
            <h2>🔐 التشفير المحلي للبيانات الحساسة (Web Crypto AES-GCM)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:1rem;">تشفير البيانات الطبية والسجلات بكلمة سر رئيسية على الجهاز 100% بدون إنترنت لحمايتها في حال فقدان الهاتف.</p>

            <div class="input-group">
                <label>كلمة السر الرئيسية للتشفير (Master Passcode):</label>
                <input type="password" id="crypto-passcode" class="input-field" placeholder="أدخل كلمة سر قوية">
            </div>

            <div class="input-group">
                <label>النص/البيانات المراد تشفيرها:</label>
                <textarea id="crypto-plaintext" class="input-field" rows="2" placeholder="أدخل بيانات سريّة لتشفيرها..."></textarea>
            </div>

            <div class="grid-2">
                <button class="btn btn-green" onclick="encryptDataAES()">🔒 تشفير البيانات (Encrypt AES)</button>
                <button class="btn btn-blue" onclick="decryptDataAES()">🔓 فك التشفير (Decrypt AES)</button>
            </div>

            <div id="crypto-output-box" style="display:none; margin-top:1rem; padding:1rem; background:var(--bg-inner); border-radius:8px;">
                <label style="font-size:0.85rem; color:var(--text-sub);">النتيجة:</label>
                <div id="crypto-output-text" style="font-family:monospace; font-size:0.9rem; word-break:break-all; color:var(--accent-yellow); margin-top:0.3rem;"></div>
            </div>
        </div>
    </section>

    <!-- Tab 1: i18n Interface -->
    <section id="i18n-tab" class="tab-content">
        <div class="card">
            <h2 id="i18n-title">🌐 الدعم متعدد اللغات (Multi-Lingual i18n)</h2>
            <p id="i18n-desc" style="color:var(--text-sub); font-size:0.85rem;">تبديل لغة واجهة التطبيق.</p>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="switchTab('crypto-tab', this)">
            <span>🔐</span>
            <span>التشفير</span>
        </button>
        <button onclick="switchTab('i18n-tab', this)">
            <span>🌐</span>
            <span id="nav-lang">اللغة</span>
        </button>
    </nav>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        }

        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
            localStorage.setItem('night_mode', document.body.classList.contains('night-mode') ? 'true' : 'false');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Task 21: Web Crypto API AES-GCM Implementation
        async function getCryptoKey(passcode) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                'raw', enc.encode(passcode), 'PBKDF2', false, ['deriveKey']
            );
            return window.crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: enc.encode('emergency_kit_salt'), iterations: 100000, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }

        async function encryptDataAES() {
            const pass = document.getElementById('crypto-passcode').value;
            const text = document.getElementById('crypto-plaintext').value;
            if (!pass || !text) { alert('يرجى أدخال كلمة السر والنص'); return; }

            const key = await getCryptoKey(pass);
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const enc = new TextEncoder();
            const encrypted = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(text));

            const combined = new Uint8Array(iv.length + encrypted.byteLength);
            combined.set(iv);
            combined.set(new Uint8Array(encrypted), iv.length);

            const b64 = btoa(String.fromCharCode.apply(null, combined));
            document.getElementById('crypto-output-text').textContent = b64;
            document.getElementById('crypto-output-box').style.display = 'block';
        }

        async function decryptDataAES() {
            const pass = document.getElementById('crypto-passcode').value;
            const b64 = document.getElementById('crypto-plaintext').value.trim();
            if (!pass || !b64) { alert('يرجى أدخال كلمة السر والنص المشفر في الخانة'); return; }

            try {
                const combined = new Uint8Array(atob(b64).split('').map(c => c.charCodeAt(0)));
                const iv = combined.slice(0, 12);
                const data = combined.slice(12);

                const key = await getCryptoKey(pass);
                const decrypted = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
                const dec = new TextDecoder();
                document.getElementById('crypto-output-text').textContent = dec.decode(decrypted);
                document.getElementById('crypto-output-box').style.display = 'block';
            } catch (e) {
                alert('فشل فك التشفير: كلمة السر غير صحيحة أو البيانات تالفة');
            }
        }
    </script>
</body>
</html>
