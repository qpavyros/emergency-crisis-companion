<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="EmergencyKit PWA - أداة الطوارئ والفرز الطبي وحسابات البقاء الميدانية بدون إنترنت 100%">
    <title>EmergencyKit PWA - رفيق الطوارئ والفرز الطبي الميداني والشامل</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-slate: #475569;
        }

        body.hud-mode {
            --bg-primary: #000000 !important;
            --bg-card: #050505 !important;
            --bg-inner: #000000 !important;
            --text-main: #ffff00 !important;
            --text-sub: #ffffaa !important;
            --border-color: #ffff00 !important;
            --accent-red: #ff3333 !important;
            --accent-yellow: #ffff00 !important;
            --accent-green: #00ff00 !important;
            --accent-blue: #00ffff !important;
            --accent-slate: #222200 !important;
        }

        body.extreme-battery {
            --bg-primary: #000000 !important;
            --bg-card: #000000 !important;
            --bg-inner: #000000 !important;
            --text-main: #ffffff !important;
            --text-sub: #aaaaaa !important;
            --border-color: #ffffff !important;
            --accent-red: #ffffff !important;
            --accent-yellow: #ffffff !important;
            --accent-green: #ffffff !important;
            --accent-blue: #ffffff !important;
            --accent-slate: #000000 !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); line-height: 1.5; padding-bottom: 75px; transition: background 0.2s, color 0.2s; contain: content; }
        
        header { background: #b91c1c; padding: 0.75rem 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; }
        body.hud-mode header { background: #000000 !important; border-bottom: 3px solid #ffff00; }
        header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 0.4rem; }

        nav { display: flex; background: #020617; position: fixed; bottom: 0; width: 100%; z-index: 100; border-top: 1px solid var(--border-color); overflow-x: auto; }
        body.hud-mode nav { background: #000000 !important; border-top: 3px solid #ffff00; }
        nav button { flex: 1; min-width: 48px; padding: 0.6rem 0.1rem; background: none; border: none; color: var(--text-sub); font-size: 0.58rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; white-space: nowrap; }
        nav button.active { color: var(--text-main); font-weight: bold; background: var(--bg-card); border-top: 2px solid var(--accent-red); }

        .tab-content { display: none; padding: 1rem; max-width: 850px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent-red); display: flex; align-items: center; gap: 0.5rem; }

        .btn { padding: 0.7rem 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; margin-top: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-yellow { background: var(--accent-yellow); color: black; }
        .btn-blue { background: var(--accent-blue); color: black; }
        .btn-slate { background: var(--accent-slate); color: white; }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-sub); }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border-color); font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 EmergencyKit PWA v4.1 3D</h1>
        <div style="display:flex; gap:0.4rem;">
            <button onclick="toggleTacticalHUD()" class="btn btn-yellow" style="width:auto; padding:0.3rem 0.5rem; font-size:0.75rem; margin:0;">🖥️ HUD</button>
        </div>
    </header>

    <!-- Tab 0: 3D Canvas Interactive Body Trauma Map (Self-Evolving #2) -->
    <section id="bodymap-tab" class="tab-content active">
        <div class="card" style="text-align:center;">
            <h2>🧍 الخريطة التفاعلية لإصابات الجسم (Interactive Anatomy Trauma Map)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:1rem;">انقر على منطقة الإصابة في مجسم الجسم التفاعلي لاستدعاء بروتوكول الإسعاف الفوري.</p>

            <div style="background:var(--bg-inner); padding:1rem; border-radius:12px; display:inline-block; position:relative;">
                <canvas id="body-canvas" width="220" height="320" style="cursor:pointer;" onclick="handleBodyClick(event)"></canvas>
            </div>

            <div id="body-trauma-info" style="display:none; margin-top:1rem; padding:1rem; background:var(--bg-inner); border-radius:10px; text-align:right;">
                <h4 id="body-region-title" style="color:var(--accent-red); margin-bottom:0.4rem;"></h4>
                <p id="body-region-desc" style="font-size:0.85rem; color:var(--text-sub);"></p>
            </div>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="switchTab('bodymap-tab', this)">
            <span>🧍</span>
            <span>مجسم الجسم</span>
        </button>
    </nav>

    <script defer>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
            });
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function toggleTacticalHUD() { document.body.classList.toggle('hud-mode'); }

        // Self-Evolving #2: 3D Body Canvas Interactive Renderer
        const canvas = document.getElementById('body-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            function drawBodyDiagram() {
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 220, 320);
                
                // Head
                ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(110, 45, 25, 0, Math.PI * 2); ctx.fill();
                
                // Torso / Chest
                ctx.fillStyle = '#ef4444'; ctx.fillRect(80, 80, 60, 90);
                
                // Arms
                ctx.fillStyle = '#eab308'; ctx.fillRect(45, 80, 25, 100); ctx.fillRect(150, 80, 25, 100);
                
                // Legs
                ctx.fillStyle = '#22c55e'; ctx.fillRect(80, 180, 25, 120); ctx.fillRect(115, 180, 25, 120);
                
                // Text labels
                ctx.fillStyle = '#ffffff'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
                ctx.fillText('الرأس', 110, 49); ctx.fillText('الصدر والبطن', 110, 130);
                ctx.fillText('الذراعين', 57, 130); ctx.fillText('الساقين', 110, 240);
            }
            drawBodyDiagram();
        }

        function handleBodyClick(e) {
            const rect = canvas.getBoundingClientRect();
            const y = e.clientY - rect.top;
            
            const infoBox = document.getElementById('body-trauma-info');
            const title = document.getElementById('body-region-title');
            const desc = document.getElementById('body-region-desc');

            if (y < 70) {
                title.textContent = '🧠 إصابات الرأس والعنق (Head & Neck Trauma)';
                desc.textContent = 'بروتوكول: تثبيت الفقرات العنقوية، تقييم مقياس غلاسكو GCS، وفحص اتساع الحدقتين.';
            } else if (y >= 70 && y < 170) {
                title.textContent = '🫁 إصابات الصدر والبطن (Chest & Abdomen Trauma)';
                desc.textContent = 'بروتوكول: تركيب اللاصق الصدري ذي الصمام (Vented Chest Seal)، فحص استرواح الرئة والنزيف الداخلي.';
            } else {
                title.textContent = '🦵 إصابات الأطراف والساقين (Extremity Trauma)';
                desc.textContent = 'بروتوكول: تركيب العاصبة الشريانية (Tourniquet) 5-7 سم فوق النزيف وتثبيت كسور عظمة الفخذ.';
            }
            infoBox.style.display = 'block';
        }
    </script>
</body>
</html>
