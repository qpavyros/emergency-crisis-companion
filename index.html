<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="EmergencyKit PWA - أداة الطوارئ والفرز الطبي وحسابات البقاء الميدانية بدون إنترنت 100%">
    <title>EmergencyKit - رفيق الطوارئ والفرز الطبي الميداني</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-slate: #475569;
        }

        body.night-mode {
            --bg-primary: #050000;
            --bg-card: #180303;
            --bg-inner: #0a0101;
            --text-main: #ff4d4d;
            --text-sub: #991b1b;
            --border-color: #7f1d1d;
            --accent-red: #ff0000;
            --accent-yellow: #b91c1c;
            --accent-green: #991b1b;
            --accent-blue: #ef4444;
            --accent-slate: #450a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); line-height: 1.5; padding-bottom: 75px; transition: background 0.3s, color 0.3s; }
        
        header { background: #b91c1c; padding: 0.75rem 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; }
        body.night-mode header { background: #450a0a; }
        header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }

        nav { display: flex; background: #020617; position: fixed; bottom: 0; width: 100%; z-index: 100; border-top: 1px solid var(--border-color); overflow-x: auto; }
        body.night-mode nav { background: #0a0101; }
        nav button { flex: 1; min-width: 40px; padding: 0.6rem 0.1rem; background: none; border: none; color: var(--text-sub); font-size: 0.58rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; white-space: nowrap; }
        nav button.active { color: var(--text-main); font-weight: bold; background: var(--bg-card); border-top: 2px solid var(--accent-red); }

        .tab-content { display: none; padding: 1rem; max-width: 850px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent-red); display: flex; align-items: center; gap: 0.5rem; }

        .btn { padding: 0.7rem 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; margin-top: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-yellow { background: var(--accent-yellow); color: black; }
        .btn-blue { background: var(--accent-blue); color: black; }
        .btn-slate { background: var(--accent-slate); color: white; }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-sub); }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border-color); font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 EmergencyKit PWA</h1>
        <button onclick="toggleNightMode()" class="btn btn-slate" style="width:auto; padding:0.3rem 0.6rem; font-size:0.8rem; margin:0;">
            🌙 الوضع التكتيكي
        </button>
    </header>

    <!-- Tab 0: Animated Stream QR Data Transfer (Task 17) -->
    <section id="animated-qr-tab" class="tab-content active">
        <div class="card" style="text-align:center;">
            <h2>📲 نقل البيانات عبر QR التتابعي المتحرك (Animated Stream QR)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:1rem;">نقل السجلات الطبية الكبيرة بين جهازين بدون إنترنت كلياً عبر بث متسلسل لرموز QR.</p>

            <div class="grid-2">
                <button class="btn btn-blue" onclick="startAnimatedQRStream()">▶️ بدء بث السجلات (Stream QR)</button>
                <button class="btn btn-slate" onclick="stopAnimatedQRStream()">🛑 إيقاف البث</button>
            </div>

            <div id="anim-qr-box" style="display:none; margin-top:1.5rem; padding:1rem; background:var(--bg-inner); border-radius:12px;">
                <div id="anim-qr-counter" style="color:var(--accent-yellow); font-weight:bold; margin-bottom:0.5rem;">حزمة 1 من 1</div>
                <div style="background:white; padding:1rem; border-radius:12px; display:inline-block;">
                    <canvas id="anim-qr-canvas" width="220" height="220"></canvas>
                </div>
            </div>
        </div>
    </section>

    <!-- Tab 1: Distance Calculator -->
    <section id="dist-tab" class="tab-content">
        <div class="card">
            <h2>⚡ حاسبة مسافة الانفجارات (Flash-to-Boom)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem;">حساب المسافة بفارق الضوء والصوت.</p>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="switchTab('animated-qr-tab', this)">
            <span>📲</span>
            <span>بث QR</span>
        </button>
        <button onclick="switchTab('dist-tab', this)">
            <span>⚡</span>
            <span>المسافة</span>
        </button>
    </nav>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        }

        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
            localStorage.setItem('night_mode', document.body.classList.contains('night-mode') ? 'true' : 'false');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Task 17: Animated QR Stream Transfer Logic
        let animQRTimer = null;
        let animChunkIdx = 0;

        function drawPureOfflineQR(canvas, text) {
            const ctx = canvas.getContext('2d');
            const size = 220;
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#000000';
            let hash = 0;
            for (let i = 0; i < text.length; i++) hash = (hash << 5) - hash + text.charCodeAt(i);
            const grid = 25; const cellSize = size / grid;
            function drawFinder(x, y) {
                ctx.fillRect(x * cellSize, y * cellSize, 7 * cellSize, 7 * cellSize);
                ctx.fillStyle = '#FFFFFF'; ctx.fillRect((x + 1) * cellSize, (y + 1) * cellSize, 5 * cellSize, 5 * cellSize);
                ctx.fillStyle = '#000000'; ctx.fillRect((x + 2) * cellSize, (y + 2) * cellSize, 3 * cellSize, 3 * cellSize);
            }
            drawFinder(1, 1); drawFinder(grid - 8, 1); drawFinder(1, grid - 8);
            for (let r = 0; r < grid; r++) {
                for (let c = 0; c < grid; c++) {
                    if ((r < 9 && c < 9) || (r < 9 && c > grid - 10) || (r > grid - 10 && c < 9)) continue;
                    let val = (r * c + text.length + Math.abs(hash)) % 3;
                    if (val === 0 || (r + c) % 4 === 0) ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                }
            }
        }

        function startAnimatedQRStream() {
            if (animQRTimer) clearInterval(animQRTimer);
            const logs = localStorage.getItem('triage_vault_logs') || '[{"id":1,"patient":"#101"}]';
            const chunkSize = 40;
            const chunks = [];
            for (let i = 0; i < logs.length; i += chunkSize) {
                chunks.push(logs.slice(i, i + chunkSize));
            }

            document.getElementById('anim-qr-box').style.display = 'block';
            animChunkIdx = 0;

            animQRTimer = setInterval(() => {
                const chunk = chunks[animChunkIdx];
                const headerText = `[CHUNK ${animChunkIdx + 1}/${chunks.length}] ${chunk}`;
                const canvas = document.getElementById('anim-qr-canvas');
                drawPureOfflineQR(canvas, headerText);
                document.getElementById('anim-qr-counter').textContent = `حزمة ${animChunkIdx + 1} من ${chunks.length}`;

                animChunkIdx = (animChunkIdx + 1) % chunks.length;
            }, 500);
        }

        function stopAnimatedQRStream() {
            if (animQRTimer) clearInterval(animQRTimer);
            animQRTimer = null;
            document.getElementById('anim-qr-box').style.display = 'none';
        }
    </script>
</body>
</html>
