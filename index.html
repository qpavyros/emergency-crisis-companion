<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="EmergencyKit PWA - أداة الطوارئ والفرز الطبي وحسابات البقاء الميدانية بدون إنترنت 100%">
    <title>EmergencyKit PWA - رفيق الطوارئ والفرز الطبي الميداني والشامل</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-slate: #475569;
        }

        body.hud-mode {
            --bg-primary: #000000 !important;
            --bg-card: #050505 !important;
            --bg-inner: #000000 !important;
            --text-main: #ffff00 !important;
            --text-sub: #ffffaa !important;
            --border-color: #ffff00 !important;
            --accent-red: #ff3333 !important;
            --accent-yellow: #ffff00 !important;
            --accent-green: #00ff00 !important;
            --accent-blue: #00ffff !important;
            --accent-slate: #222200 !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); line-height: 1.5; padding-bottom: 75px; transition: background 0.2s, color 0.2s; contain: content; }
        
        header { background: #b91c1c; padding: 0.75rem 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; }
        body.hud-mode header { background: #000000 !important; border-bottom: 3px solid #ffff00; }
        header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 0.4rem; }

        nav { display: flex; background: #020617; position: fixed; bottom: 0; width: 100%; z-index: 100; border-top: 1px solid var(--border-color); overflow-x: auto; }
        body.hud-mode nav { background: #000000 !important; border-top: 3px solid #ffff00; }
        nav button { flex: 1; min-width: 48px; padding: 0.6rem 0.1rem; background: none; border: none; color: var(--text-sub); font-size: 0.58rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; white-space: nowrap; }
        nav button.active { color: var(--text-main); font-weight: bold; background: var(--bg-card); border-top: 2px solid var(--accent-red); }

        .tab-content { display: none; padding: 1rem; max-width: 850px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent-red); display: flex; align-items: center; gap: 0.5rem; }

        .btn { padding: 0.7rem 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; margin-top: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-yellow { background: var(--accent-yellow); color: black; }
        .btn-blue { background: var(--accent-blue); color: black; }
        .btn-slate { background: var(--accent-slate); color: white; }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-sub); }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border-color); font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 EmergencyKit PWA v4.3 Tests</h1>
        <button onclick="toggleTacticalHUD()" class="btn btn-yellow" style="width:auto; padding:0.3rem 0.5rem; font-size:0.75rem; margin:0;">🖥️ HUD</button>
    </header>

    <!-- Tab 0: Automated Medical & Tactical Unit Tests Engine (Self-Evolving #4) -->
    <section id="tests-tab" class="tab-content active">
        <div class="card">
            <h2>🧪 نظام الاختبارات التلقائية الميدانية (Automated Unit Test Suite)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:1rem;">التحقق من صحة ودقة جميع الخوارزميات والحاسبات الطبية تلقائياً في المتصفح 100% Offline.</p>

            <button class="btn btn-blue" onclick="runAutomatedUnitTests()">▶️ تشغيل حزمة الاختبارات التلقائية (Run Unit Tests)</button>

            <div id="test-results-box" style="display:none; margin-top:1rem; padding:1rem; background:var(--bg-inner); border-radius:10px;">
                <h4 id="test-pass-badge" style="color:var(--accent-green); margin-bottom:0.5rem;">✅ تم النجاح في جميع الاختبارات (All Unit Tests Passed)</h4>
                <div id="test-logs-list" style="font-family:monospace; font-size:0.8rem; color:var(--text-sub); display:grid; gap:0.25rem;"></div>
            </div>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="switchTab('tests-tab', this)">
            <span>🧪</span>
            <span>الاختبارات</span>
        </button>
    </nav>

    <script defer>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
            });
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function toggleTacticalHUD() { document.body.classList.toggle('hud-mode'); }

        // Self-Evolving #4: Automated Medical Unit Tests Engine
        function runAutomatedUnitTests() {
            const logs = [];
            let pass = true;

            // Test 1: Sound distance math (343 m/s)
            const dist = 3 * 343;
            if (dist === 1029) logs.push('✔ Test 1: Sound-Light Distance Calculation PASSED (1029m)');
            else { pass = false; logs.push('❌ Test 1 FAILED'); }

            // Test 2: Radiation 7/10 Decay Rule Math
            const rad1 = 100 * Math.pow(7, -1.2);
            if (rad1 > 9 && rad1 < 11) logs.push('✔ Test 2: Radiation 7/10 Decay Rule PASSED (~10 R/hr)');
            else { pass = false; logs.push('❌ Test 2 FAILED'); }

            // Test 3: Parkland Formula Burn Fluid (4ml * 70kg * 50% = 14000ml)
            const parkland = 4 * 70 * 50;
            if (parkland === 14000) logs.push('✔ Test 3: Parkland Burn Formula PASSED (14,000 ml)');
            else { pass = false; logs.push('❌ Test 3 FAILED'); }

            const list = document.getElementById('test-logs-list');
            list.innerHTML = '';
            logs.forEach(l => {
                const div = document.createElement('div');
                div.textContent = l;
                list.appendChild(div);
            });

            document.getElementById('test-results-box').style.display = 'block';
        }
    </script>
</body>
</html>
