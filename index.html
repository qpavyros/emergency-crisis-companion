<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="EmergencyKit PWA - أداة الطوارئ والفرز الطبي وحسابات البقاء الميدانية بدون إنترنت 100%">
    <title>EmergencyKit - رفيق الطوارئ والفرز الطبي الميداني</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-slate: #475569;
        }

        body.night-mode {
            --bg-primary: #050000;
            --bg-card: #180303;
            --bg-inner: #0a0101;
            --text-main: #ff4d4d;
            --text-sub: #991b1b;
            --border-color: #7f1d1d;
            --accent-red: #ff0000;
            --accent-yellow: #b91c1c;
            --accent-green: #991b1b;
            --accent-blue: #ef4444;
            --accent-slate: #450a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); line-height: 1.5; padding-bottom: 75px; transition: background 0.3s, color 0.3s; }
        
        header { background: #b91c1c; padding: 0.75rem 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; }
        body.night-mode header { background: #450a0a; }
        header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }

        nav { display: flex; background: #020617; position: fixed; bottom: 0; width: 100%; z-index: 100; border-top: 1px solid var(--border-color); overflow-x: auto; }
        body.night-mode nav { background: #0a0101; }
        nav button { flex: 1; min-width: 40px; padding: 0.6rem 0.1rem; background: none; border: none; color: var(--text-sub); font-size: 0.58rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; white-space: nowrap; }
        nav button.active { color: var(--text-main); font-weight: bold; background: var(--bg-card); border-top: 2px solid var(--accent-red); }

        .tab-content { display: none; padding: 1rem; max-width: 850px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent-red); display: flex; align-items: center; gap: 0.5rem; }

        .btn { padding: 0.7rem 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; margin-top: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-yellow { background: var(--accent-yellow); color: black; }
        .btn-blue { background: var(--accent-blue); color: black; }
        .btn-slate { background: var(--accent-slate); color: white; }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-sub); }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border-color); font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 EmergencyKit PWA</h1>
        <button onclick="toggleNightMode()" class="btn btn-slate" style="width:auto; padding:0.3rem 0.6rem; font-size:0.8rem; margin:0;">
            🌙 الوضع التكتيكي
        </button>
    </header>

    <!-- Tab 0: Audio Notes Recorder & IndexedDB Storage (Task 19) -->
    <section id="audio-tab" class="tab-content active">
        <div class="card" style="text-align:center;">
            <h2>🎙️ مسجل الملاحظات الصوتية الميدانية (Audio Notes Vault)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:1rem;">تسجيل ملاحظات صوتية لحالة المصابين وتخزينها محلياً في IndexedDB.</p>

            <div id="audio-timer-status" style="font-size:1.1rem; font-weight:bold; color:var(--accent-blue); margin-bottom:0.5rem;">جاهز للتسجيل</div>

            <div class="grid-2">
                <button id="rec-start-btn" class="btn btn-red" onclick="startAudioRecord()">🎙️ بدء التسجيل الصوتي</button>
                <button id="rec-stop-btn" class="btn btn-slate" onclick="stopAudioRecord()" disabled>🛑 إيقاف وحفظ</button>
            </div>

            <div style="margin-top:1.5rem; text-align:right;">
                <h4 style="color:var(--accent-blue); margin-bottom:0.5rem;">🎧 التسجيلات المحفوظة محلياً:</h4>
                <div id="audio-memos-list"></div>
            </div>
        </div>
    </section>

    <!-- Tab 1: Data IO -->
    <section id="dataio-tab" class="tab-content">
        <div class="card">
            <h2>📁 استيراد وتصدير بيانات المرضى (CSV & JSON Data)</h2>
            <p style="color:var(--text-sub); font-size:0.85rem;">تصدير واستيراد سجلات الفرز.</p>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="switchTab('audio-tab', this)">
            <span>🎙️</span>
            <span>صوتيات</span>
        </button>
        <button onclick="switchTab('dataio-tab', this)">
            <span>📁</span>
            <span>الملفات</span>
        </button>
    </nav>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        }

        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
            localStorage.setItem('night_mode', document.body.classList.contains('night-mode') ? 'true' : 'false');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Task 19: MediaRecorder & IndexedDB Logic
        let mediaRecorder = null;
        let audioChunks = [];
        let audioDb = null;

        const req = indexedDB.open('EmergencyKitAudioDB', 1);
        req.onupgradeneeded = (e) => {
            audioDb = e.target.result;
            if (!audioDb.objectStoreNames.contains('memos')) {
                audioDb.createObjectStore('memos', { keyPath: 'id', autoIncrement: true });
            }
        };
        req.onsuccess = (e) => {
            audioDb = e.target.result;
            loadAudioMemos();
        };

        async function startAudioRecord() {
            if (!navigator.mediaDevices) { alert('الميكروفون غير مدعوم في جهازك'); return; }
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                saveAudioMemo(blob);
            };

            mediaRecorder.start();
            document.getElementById('audio-timer-status').textContent = '🔴 جاري التسجيل الصوتي...';
            document.getElementById('rec-start-btn').disabled = true;
            document.getElementById('rec-stop-btn').disabled = false;
        }

        function stopAudioRecord() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                document.getElementById('audio-timer-status').textContent = '✅ تم الحفظ!';
                document.getElementById('rec-start-btn').disabled = false;
                document.getElementById('rec-stop-btn').disabled = true;
            }
        }

        function saveAudioMemo(blob) {
            if (!audioDb) return;
            const tx = audioDb.transaction('memos', 'readwrite');
            const memo = {
                time: new Date().toLocaleTimeString('ar-EG'),
                blob: blob
            };
            tx.objectStore('memos').add(memo);
            tx.oncomplete = () => loadAudioMemos();
        }

        function loadAudioMemos() {
            if (!audioDb) return;
            const tx = audioDb.transaction('memos', 'readonly');
            const req = tx.objectStore('memos').getAll();
            req.onsuccess = () => {
                const container = document.getElementById('audio-memos-list');
                container.innerHTML = '';
                req.result.forEach(m => {
                    const div = document.createElement('div');
                    div.style.cssText = 'background:var(--bg-inner); padding:0.75rem; border-radius:8px; margin-top:0.5rem; display:flex; align-items:center; justify-content:space-between;';
                    const audioUrl = URL.createObjectURL(m.blob);
                    div.innerHTML = `
                        <span style="font-size:0.85rem; color:var(--accent-blue);">تسجيل (${m.time})</span>
                        <audio src="${audioUrl}" controls style="height:30px; max-width:200px;"></audio>
                    `;
                    container.appendChild(div);
                });
            };
        }
    </script>
</body>
</html>
